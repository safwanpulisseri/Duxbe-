name: duxbe
description: Duxbe Business
version: 3.0.0+60
publish_to: none

environment:
  sdk: "^3.6.0"

dependencies:
  another_flushbar: ^1.12.30
  audioplayers: ^6.1.1
  barcode: ^2.2.8
  cached_network_image: ^3.4.1
  collection: ^1.18.0
  connectivity_plus: ^6.0.5
  cupertino_icons: ^1.0.8
  defer_pointer: ^0.0.2
  dio: ^5.7.0
  dotted_border: ^2.1.0
  dropdown_search: ^6.0.2
  esc_pos_utils:
    git:
      url: https://github.com/alfas-hancod/esc_pos_utils
      ref: master
  excel: ^4.0.6
  facebook_app_events: ^0.20.1
  file_picker: ^10.2.0
  firebase_analytics: ^11.4.4
  firebase_core: ^3.12.1
  firebase_crashlytics: ^4.3.4
  firebase_messaging: ^15.2.6
  fl_chart: ^0.71.0
  flutter:
    sdk: flutter
  flutter_bluetooth_basic:
    git:
      url: https://github.com/alfas-hancod/flutter_bluetooth_basic
      ref: master
  flutter_form_builder: ^10.0.1
  flutter_iconpicker: ^4.0.1
  flutter_inappwebview: ^6.1.5
  flutter_localizations:
    sdk: flutter
  flutter_markdown: ^0.7.7
  flutter_quill: ^10.8.5
  flutter_riverpod: ^2.5.1
  flutter_slidable: ^3.1.1
  flutter_svg: ^2.0.10+1
  flutter_timezone: ^4.1.0
  flutter_web_plugins:
    sdk: flutter
  form_builder_extra_fields: ^12.0.0
  form_builder_validators: ^11.1.2
  freezed_annotation: ^2.4.4
  go_router: ^15.1.2
  grouped_list: ^6.0.0
  hancod_theme:
    git:
      url: https://github.com/Hancod-Digital/hancod_theme.git
      ref: duxbe-3.32.0
    # path:
    #   ../duxbe-business-theme
  http: ^1.2.2
  image: ^4.3.0
  image_picker: ^1.1.2
  infinite_scroll_pagination: ^4.1.0
  intl: ^0.20.2
  json_annotation: ^4.9.0
  multi_dropdown: ^3.0.1
  network_info_plus: ^6.1.1
  package_info_plus: ^8.3.0
  path: ^1.9.0
  path_provider: ^2.1.4
  pdf: ^3.11.1
  permission_handler: ^11.3.1
  phone_form_field: ^10.0.8
  ping_discover_network_forked: ^0.0.1
  pinput: ^5.0.0
  pluto_grid_plus: ^8.4.14
  printing: ^5.13.3
  riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  scaled_app: ^2.3.0
  shared_preferences: ^2.3.2
  shimmer: ^3.0.0
  simple_barcode_scanner: ^0.3.0
  sliver_tools: ^0.2.12
  socket_io_client: ^3.0.2
  sticky_grouped_list: ^3.1.0
  sticky_headers: ^0.3.0+2
  supabase_flutter: ^2.8.0
  super_drag_and_drop: ^0.9.1
  timezone: ^0.10.0
  upgrader: ^11.2.0
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  web: ^1.1.0

dependency_overrides:
  analyzer_plugin: 0.13.1
  intl: ^0.20.2

dev_dependencies:
  build_runner: ^2.4.13
  flutter_gen_runner: ^5.8.0
  flutter_test:
    sdk: flutter
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  mocktail: ^1.0.4
  msix: ^3.16.9
  riverpod_generator: ^2.4.3
  riverpod_lint: ^2.3.13
  very_good_analysis: ^7.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - lib/l10n/
    - assets/images/
    - assets/exe/
    - assets/icons/
    - assets/fonts/
    - assets/sounds/
    - assets/markdowns/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
        - asset: assets/fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
    - family: NatoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
        - asset: assets/fonts/NotoSansArabic-Light.ttf
        - asset: assets/fonts/NotoSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansArabic-Bold.ttf
          weight: 700

flutter_gen:
  output: lib/shared/utils/ # Optional (default: lib/gen/)
  line_length: 80 # Optional (default: 80)

  # Optional
  integrations:
    flutter_svg: true
    rive: true
    lottie: true

msix_config:
  display_name: Duxbe
  publisher_display_name: Hancod Digital Pvt Lmt.
  identity_name: com.duxbe.business
  msix_version: 1.0.0.0
  logo_path: .\assets\images\duxbe_whitebg.png
  capabilities: internetClient, location, microphone, webcam
  windows_build_args: -t lib\main_development.dart --no-tree-shake-icons
  sign_msix: true
